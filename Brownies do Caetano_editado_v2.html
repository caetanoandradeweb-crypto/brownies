<section class="w rv">${st("Conheça nossos brownies")}<div class="g">${P.map(card).join("")}</div></section>
<section class="w rv">${st("Brownie ou Blondie?","Qual combina com você? Você prefere chocolate intenso ou um doce mais marcante? É só uma brincadeira para descobrir preferência, não uma avaliação.")}<div class="tg"><button class="ch" data-a="cmp" data-v="0" aria-pressed="true">🍫 Quero intensidade</button><input id="rg" type="range" min="0" max="1" value="0" aria-label="Brownie (esquerda) ou Blondie (direita)"><button class="ch" data-a="cmp" data-v="1" aria-pressed="false">🤍 Quero mais doce</button></div><div id="cp">${cpH(0)}</div></section>
<section class="w rv" data-c>${st("Escolha seu brigadeiro")}<div class="g2"><div><button class="ch bgc" data-a="bg" data-v="preto" aria-pressed="true"><b>Brigadeiro Preto</b><br>Leite condensado, chocolate amargo, creme de leite, manteiga.</button><button class="ch bgc" data-a="bg" data-v="branco" aria-pressed="false"><b>Brigadeiro Branco</b><br>Leite condensado, chocolate branco, creme de leite, manteiga.</button></div><div class="g"><div class="art" data-b="brownie" data-x="0">${art("brownie","preto",0)}</div><div class="art" data-b="blondie" data-x="0">${art("blondie","preto",0)}</div></div></div></section>
<section class="w rv"><div class="sp"><i class="fo" style="top:30px;left:6%"></i><i class="fk" style="top:60px;right:8%"></i><i class="fo" style="bottom:40px;right:4%"></i><i class="fk" style="bottom:70px;left:3%"></i><h2 style="max-width:16ch;margin-bottom:28px;position:relative">Para quem não quer parar no tradicional.</h2><div class="g" style="position:relative">${P.filter(p=>p.x).map(p=>`<div><div class="art">${art(p.b,"preto",1)}</div><h3>${p.n}</h3><p class="mu">${cap(p.b)} + brigadeiro + Oreo + chocolate</p><a class="b" href="#/produto/${p.s}">Conhecer</a></div>`).join("")}</div></div></section>
<section class="w rv">${st("Ingredientes de verdade.")}<div class="g">${[["Brownie",ING.brownie],["Blondie",ING.blondie],["Brigadeiro",ING.brigadeiro]].map(([t,l])=>`<div class="cd"><h3>${t}</h3>${chips(l)}</div>`).join("")}</div></section>
<section class="w rv">${st("Galeria","Espaços reservados: substitua pelas fotos reais.")}<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))">${["Brownie inteiro","Brownie cortado","Brigadeiro","Oreo","Pedaços de chocolate","Blondie","Embalagem","Produto pronto"].map(t=>`<button class="gt" data-a="lb" data-v="${t}">${t}</button>`).join("")}</div></section>
<section class="w rv"><div class="rw">${st("Depoimentos")}<span><button class="ch" data-a="sl" data-v="-1" aria-label="Anterior">←</button> <button class="ch" data-a="sl" data-v="1" aria-label="Próximo">→</button></span></div><div class="ts" id="ts" tabindex="0" aria-label="Depoimentos">${[1,2,3].map(()=>`<figure class="cd"><blockquote>“Comentário do cliente”</blockquote><figcaption class="mu">Nome do cliente</figcaption><small class="mu">Espaço para depoimento real.</small></figure>`).join("")}</div></section>`;
const cardapio=()=>`<section class="w" style="margin-top:36px">${st("Cardápio","Escolha o brigadeiro e adicione ao carrinho.")}<div class="fl" role="group" aria-label="Filtros">${["todos","brownie","blondie","tradicional","especial"].map(f=>`<button class="ch" data-a="flt" data-v="${f}" aria-pressed="${f==FL}">${cap(f)}</button>`).join("")}</div><div class="g" id="gr">${grid()}</div></section>`;
const FT={todos:()=>1,brownie:p=>p.b=="brownie",blondie:p=>p.b=="blondie",tradicional:p=>!p.x,especial:p=>p.x};
const grid=()=>P.filter(FT[FL]).map(card).join("");
const prod=p=>`<div class="w pp" data-c data-s="${p.s}" style="margin-top:36px"><div><div class="art big" data-b="${p.b}" data-x="${p.x}">${art(p.b,gs(p.s),p.x)}</div><div class="g" style="grid-template-columns:repeat(3,1fr);margin-top:14px">${[1,2,3].map(i=>`<div class="ph">Foto ${i}<small>substituir</small></div>`).join("")}</div></div><div>${p.badge?`<span class="bd" style="position:static">${p.badge}</span>`:""}<h1>${p.n}</h1><p class="mu" style="margin:10px 0">${p.d}</p><h3>Ingredientes</h3>${chips(ING[p.b].concat(ING.brigadeiro,p.x?["Oreo","Pedaços de chocolate"]:[]))}<h3>Brigadeiro</h3><div class="rw2">${gb(p.s,gs(p.s))}</div><label style="margin-top:14px;max-width:140px">Quantidade<input id="qt" type="number" min="1" max="99" value="1"></label><p class="pr">${mo(pr(p.s))}</p><div class="cta"><button class="b" data-a="add" data-s="${p.s}">Adicionar ao carrinho</button><button class="b o" data-a="buy" data-s="${p.s}">Comprar agora</button></div></div></div>
<section class="w"><h2 style="text-align:center">O que vem nesse ${p.b}?</h2><div class="ly">${[p.b.toUpperCase(),"BRIGADEIRO"].concat(p.x?["OREO + CHOCOLATE"]:[]).map((t,i)=>`${i?'<span aria-hidden="true">↓</span>':""}<div class="ll" style="--i:${i}">${t}</div>`).join("")}</div></section>`;
const opt=(k,v,l,d)=>`<button class="ch bgc" data-a="bd" data-k="${k}" data-v="${v}" aria-pressed="${B[k]==v}" ${d?"disabled":""}>${l}</button>`;
const bslug=()=>B.v?(B.b=="brownie"?"especial":"especial-invertido"):(B.b=="brownie"?"tradicional":"invertido");
const bl=()=>{const rd=B.v!==undefined;return `<div class="bl"><div class="art big">${B.b?art(B.b,B.g,B.v==1):"Escolha sua base para começar"}</div><div><h3>1. Escolha sua base</h3>${opt("b","brownie","Brownie")}${opt("b","blondie","Blondie")}<h3>2. Escolha seu brigadeiro</h3>${opt("g","preto","Preto",!B.b)}${opt("g","branco","Branco",!B.b)}<h3>3. Escolha a versão</h3>${opt("v",0,"Tradicional",!B.g)}${opt("v",1,"Especial (Oreo + pedaços de chocolate)",!B.g)}${rd?`<div class="fd"><h2>Seu brownie está pronto!</h2><p class="mu">${F(bslug()).n}: ${cap(B.b)} com brigadeiro ${B.g}</p><p class="pr">${mo(pr(bslug()))}</p><button class="b" data-a="addb">Adicionar ao carrinho</button></div>`:""}</div></div>`};
let BT=0;
const tabs=()=>`<div class="fl" role="tablist" aria-label="Tipo de pedido">${["Sabores do cardápio","Sabor novo"].map((t,i)=>`<button class="ch" role="tab" data-a="tab" data-v="${i}" aria-selected="${i==BT}">${t}</button>`).join("")}</div>`;
const rd=(n,l)=>`<fieldset><legend><b>${n=="b"?"Base":"Brigadeiro"}</b></legend>${l.map((x,i)=>`<label><input type="radio" name="${n}" value="${x}" ${i?"":"checked"}>${cap(x)}</label>`).join("")}</fieldset>`;
const nv=()=>`<form id="nv" class="cd fd" style="max-width:640px"><h2>Peça um sabor novo</h2><p class="mu">Tem uma ideia de sabor que ainda não existe no cardápio? Conte para o Caetano. O preço é acima de R$ 12,00 e o valor é combinado pelo WhatsApp.</p>${rd("b",["brownie","blondie"])}${rd("g",["preto","branco"])}<label>Seu nome<input name="nome" required></label><label>Descreva o sabor que você quer<textarea name="d" rows="4" required placeholder="Conte sua ideia de recheio, cobertura ou combinação"></textarea></label><button class="b" type="submit">Combinar preço pelo WhatsApp</button></form>`;
const builder=()=>{BT=0;return `<section class="w" style="margin-top:36px">${st("Monte seu brownie","Escolha passo a passo e veja o resultado.")}<div id="tabs">${tabs()}</div><div id="bx" role="tabpanel">${bl()}</div></section>`};
const sobre=()=>`<section class="w" style="margin-top:36px"><div class="g2"><div class="art big">${art("brownie","preto",1)}</div><div class="tx"><h1>Oi, eu sou o Caetano.</h1><p class="lead" style="font-family:Fraunces,Georgia,serif">Sou de informática e, no meio da correria, encontrei um jeito de transformar chocolate em algo que deixa o dia de alguém mais doce.</p><p>Cada brownie e cada blondie que sai daqui é feito com carinho, cuidado e muita dedicação. Eu separo um tempo precioso do meu dia para que cada doce chegue do jeito que eu gostaria de receber: perfeito.</p><p>Comecei a fazer brownies porque precisava de uma renda para conseguir comprar as coisas que quero e preciso. O que começou por necessidade hoje é feito com o coração.</p><p>Quando você escolhe um brownie, leva muito mais que um doce: ajuda um sonho a andar e faz parte da minha história. Obrigado de coração por isso.</p><p class="lg" style="font-size:1.6rem">Caetano</p><a class="b" href="#/monte-seu-brownie">Montar meu brownie</a></div></div></section>`;
const faq=()=>`<section class="w" style="margin-top:36px;max-width:760px"><h1>FAQ</h1><div style="margin-top:20px">${FQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</div></section>`;
const contato=()=>`<section class="w" style="margin-top:36px;max-width:720px"><h1>Contato</h1><p class="lead">Chame no WhatsApp para tirar dúvidas ou fazer seu pedido.</p><a class="b" href="${WA}" target="_blank" rel="noopener">WhatsApp: ${CONTATO.WhatsApp}</a></section>`;
const fi=(n,l,t="text",r=1)=>`<label>${l}<input name="${n}" type="${t}" ${r?"required":""}></label>`;
const checkout=()=>!C.length?`<section class="w" style="margin-top:36px"><h1>Checkout</h1><p class="mu" style="margin:12px 0">Seu carrinho está vazio.</p><a class="b" href="#/cardapio">Ver cardápio</a></section>`:`<section class="w" style="margin-top:36px"><h1>Checkout</h1><div class="g2" style="align-items:start;margin-top:24px"><form id="ck"><div class="fm">${fi("nome","Nome")}${fi("zap","Seu WhatsApp","tel")}</div><fieldset><legend><b>Forma de pagamento</b></legend>${["Pix","Cartão","Dinheiro"].map(x=>`<label><input type="radio" name="pag" value="${x}" required>${x}</label>`).join("")}</fieldset><label>Observações<textarea name="obs" rows="3" readonly>${OBS}</textarea></label><button class="b wa-final" type="submit">Finalizar pedido pelo WhatsApp</button><div id="st" role="status" class="mu" style="margin-top:14px;white-space:pre-wrap"></div></form><div class="cd"><h3>Resumo</h3>${C.map(i=>`<p>${i.q}× ${F(i.s).n} (${i.g})</p>`).join("")}<p class="rw"><b>Total</b><b>${mo(tot())}</b></p></div></div></section>`;
const ROUTES={"":home,cardapio,carrinho:cardapio,"monte-seu-brownie":builder,sobre,faq,contato,checkout};
const NAV=[["","Início"],["cardapio","Cardápio"],["monte-seu-brownie","Monte seu brownie"],["sobre","Sobre"],["faq","FAQ"],["contato","Contato"]];
const route=()=>{const[a,b]=location.hash.slice(2).split("/");H.classList.remove("o");
let h=a=="produto"&&F(b)?prod(F(b)):ROUTES[a]?ROUTES[a]():home();M.innerHTML=h;scrollTo(0,0);M.focus({preventScroll:true});
$("#NV").innerHTML=NAV.map(([r,t])=>`<a href="#/${r}" ${r==a||(a=="produto"&&r=="cardapio")?'aria-current="page"':""}>${t}</a>`).join("");
if(a=="carrinho")openC();};
const upd=()=>{sv();const n=C.reduce((a,i)=>a+i.q,0);$("#cn").textContent=n;$("#cn").classList.remove("bp");void $("#cn").offsetWidth;$("#cn").classList.add("bp");
$("#ci").innerHTML=C.length?C.map((i,n)=>{const p=F(i.s);return `<div class="ci"><div class="art">${art(p.b,i.g,p.x)}</div><div><b>${p.n}</b><div class="rw2" style="margin:6px 0">${["preto","branco"].map(g=>`<button class="ch" data-a="cg" data-n="${n}" data-v="${g}" aria-pressed="${g==i.g}">${cap(g)}</button>`).join("")}</div><div class="rw"><span><button class="ch" data-a="q" data-n="${n}" data-v="-1" aria-label="Diminuir quantidade">−</button> ${i.q} <button class="ch" data-a="q" data-n="${n}" data-v="1" aria-label="Aumentar quantidade">+</button></span><b>${mo(pr(i.s)==null?null:pr(i.s)*i.q)}</b></div></div><button class="ch" data-a="del" data-n="${n}" aria-label="Remover ${p.n}">✕</button></div>`}).join(""):'<p class="mu">Seu carrinho está vazio. Que tal escolher um brownie?</p>';
$("#cf").innerHTML=C.length?`<label>Observação<textarea id="obs" rows="2"></textarea></label><p class="rw">Subtotal <b>${mo(tot())}</b></p><p class="rw">Total <b>${mo(tot())}</b></p><a class="b" href="#/checkout" data-a="close">Finalizar pedido</a><button class="b o" data-a="close">Continuar comprando</button>`:`<a class="b" href="#/cardapio" data-a="close">Ver cardápio</a>`;
if($("#obs"))$("#obs").value=OBS;};
const openC=()=>{$("#dr").classList.add("o");$("#ov").classList.add("o");$("#dr .ch").focus()};
const closeC=()=>{$("#dr").classList.remove("o");$("#ov").classList.remove("o")};
const add=(s,g,q)=>{const i=C.find(x=>x.s==s&&x.g==g);i?i.q+=q:C.push({s,g,q});upd()};
const setC=i=>{$("#cp").innerHTML=cpH(i);$("#rg").value=i;document.querySelectorAll("[data-a=cmp]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==i))};
const msg=f=>{const L=["*Pedido - Brownies do Caetano*","Nome: "+f.nome,"WhatsApp: "+f.zap,""];C.forEach(i=>{const p=F(i.s);L.push("Produto: "+p.n,"Base: "+cap(p.b),"Brigadeiro: "+cap(i.g),"Quantidade: "+i.q,"")});
L.push("Observações: "+(f.obs||OBS||"-"),"Total: "+mo(tot()),"","Pagamento: "+f.pag);return L.join("\n")};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v,c=t.closest("[data-c]"),s=t.dataset.s;
if(a=="bg"){if(c.dataset.s)S[c.dataset.s]=v;c.querySelectorAll("[data-a=bg]").forEach(x=>x.setAttribute("aria-pressed",x==t));c.querySelectorAll(".art[data-b]").forEach(x=>x.innerHTML=art(x.dataset.b,v,+x.dataset.x))}
else if(a=="add"||a=="buy"){const q=c&&c.querySelector("#qt");add(s,gs(s),Math.max(1,parseInt(q&&q.value)||1));a=="buy"?(location.hash="#/checkout"):openC()}
else if(a=="addb"){add(bslug(),B.g,1);openC()}
else if(a=="cart")openC();else if(a=="close")closeC();
else if(a=="menu"){const o=H.classList.toggle("o");t.setAttribute("aria-expanded",o)}
else if(a=="q"){const n=+t.dataset.n;C[n].q+=+v;if(C[n].q<1)C.splice(n,1);upd()}
else if(a=="del"){C.splice(+t.dataset.n,1);upd()}
else if(a=="cg"){C[+t.dataset.n].g=v;upd()}
else if(a=="cmp")setC(+v);
else if(a=="flt"){FL=v;$("#gr").innerHTML=grid();document.querySelectorAll("[data-a=flt]").forEach(b=>b.setAttribute("aria-pressed",b==t))}
else if(a=="bd"){B[t.dataset.k]=t.dataset.k=="v"?+v:v;if(t.dataset.k=="b"){delete B.g;delete B.v}if(t.dataset.k=="g")delete B.v;$("#bx").innerHTML=bl()}
else if(a=="tab"){BT=+v;$("#tabs").innerHTML=tabs();$("#bx").innerHTML=BT?nv():bl()}
else if(a=="lb"){$("#lbc").innerHTML=`<div class="ph" style="min-height:260px"><b>${v}</b><small>Placeholder: substituir pela foto real.</small></div>`;$("#lb").showModal()}
else if(a=="lbx")$("#lb").close();
else if(a=="sl")$("#ts").scrollBy({left:+v*300,behavior:"smooth"})});
document.addEventListener("input",e=>{if(e.target.id=="rg")setC(+e.target.value);if(e.target.id=="obs")OBS=e.target.value});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeC()});
document.addEventListener("submit",e=>{if(e.target.id=="nv"){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));window.open(WA+"?text="+encodeURIComponent(["*Sabor novo - Brownies do Caetano*","Nome: "+f.nome,"Base: "+cap(f.b),"Brigadeiro: "+cap(f.g),"Ideia do sabor: "+f.d,"","Sei que o valor é acima de R$ 12,00 e quero combinar o preço."].join("\n")),"_blank");return}
if(e.target.id!="ck")return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),m=msg(f),o=$("#st");
// Integração futura: enviar `f` e `C` para API de pedidos/pagamento (Pix, cartão) aqui.
if(WHATSAPP_NUMBER=="SEU_NUMERO_AQUI"){o.textContent="Configure WHATSAPP_NUMBER no código para enviar. Prévia da mensagem:\n\n"+m;return}
window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(m),"_blank");o.textContent="Pedido aberto no WhatsApp."});
addEventListener("scroll",()=>H.classList.toggle("s",scrollY>10),{passive:true});
addEventListener("hashchange",route);
$("#FN").innerHTML=NAV.map(([r,t])=>`<a href="#/${r}">${t}</a>`).join("");
$("#FC").innerHTML=`<p><b>WhatsApp:</b> <a href="${WA}" target="_blank" rel="noopener">${CONTATO.WhatsApp}</a></p>`;
upd();route();
</script></body></html>
